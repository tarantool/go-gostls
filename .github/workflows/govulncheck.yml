name: govulncheck

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # Weekly, Mondays 04:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Not GO_VERSION from the other workflows: govulncheck has to see the Go
  # release the code actually ships against, and `@latest` of x/vuln wants
  # go 1.26. Until 2026-09 this job ran on 1.25 and worked only because its Go
  # was current; once 1.26.10 shipped, a 1.25 scan reported GO-2026-6809
  # (fixed in 1.26.10) for a standard library nobody here ships.
  GO_VERSION: "1.26"

jobs:
  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Scheduled as well as per-change: a new advisory against an unchanged
      # dependency must surface even when nobody is pushing.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
